name: "Production Stateful Workspace"

on:
  schedule:
    - cron: '0 */4 * * *' # Непрерывный запуск каждые 4 часа (Keep-Alive)
  workflow_dispatch:      # Ручной запуск из панели Actions

env:
  WORKSPACE_DIR: "workspace_data"

jobs:
  development-node:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # Завершаем чуть раньше жесткого лимита GitHub (360 минут)
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v22 for stability)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System & JS Packages (pnpm, nano, code-server)
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt-get update
          sudo apt-get install -y curl git nano

          # 1. Установка code-server через npm
          echo "Установка code-server через npm..."
          sudo npm install -g code-server --unsafe-perm --allow-scripts
          
          # 2. Установка pnpm и localtunnel для создания безопасного HTTPS туннеля
          sudo npm install -g pnpm localtunnel --allow-scripts
          
          # 3. Установка pi-agent
          echo "Installing @earendil-works/pi-coding-agent..."
          sudo npm install -g @earendil-works/pi-coding-agent --allow-scripts --prefer-online || {
            sudo pnpm install -g @earendil-works/pi-coding-agent --allow-scripts || echo "Пропускаем pi-agent"
          }
          
          mkdir -p "$WORKSPACE_DIR" .pi ~/.config/code-server

      - name: Verify Docker & Docker Compose
        run: |
          echo "=== Проверка Docker окружения ==="
          docker --version
          docker compose version
          docker ps

      # --- ЭТАП СОХРАНЕНИЯ ДАННЫХ (STATEFUL KEEP-ALIVE) ---
      - name: Restore Workspace & Tooling Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/code-server
            ~/.local/share/pnpm
            .pi/
            ${{ env.WORKSPACE_DIR }}/
          key: prod-workspace-state-${{ github.run_id }}
          restore-keys: |
            prod-workspace-state-

      # --- ОРКЕСТРАЦИЯ И ЗАПУСК СРЕДЫ ---
      - name: Run Secure Web-IDE & Tunneling
        env:
          PASSWORD: ${{ secrets.WORKSPACE_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "=== ИНИЦИАЛИЗАЦИЯ ЗАЩИЩЕННОЙ СРЕДЫ ==="
          
          if [ -z "$PASSWORD" ]; then
            echo "::warning::Секрет WORKSPACE_PASSWORD не задан. Используется дефолтный пароль 'admin'"
            export PASSWORD="admin"
          fi

          # 1. Настройка конфига code-server (авторизация по паролю)
          cat <<EOF > ~/.config/code-server/config.yaml
          bind-addr: 127.0.0.1:8080
          auth: password
          password: "$PASSWORD"
          cert: false
          EOF

          # 2. Запуск VS Code (Code-Server) в фоне
          code-server "$WORKSPACE_DIR" &
          
          # 3. Поднятие публичного Безопасного HTTPS туннеля через localtunnel
          echo "Запуск шифрованного HTTPS туннеля..."
          nohup lt --port 8080 > localtunnel.log 2>&1 &
          
          # Даем туннелю 5 секунд на получение SSL-сертификата
          sleep 5
          
          # Извлекаем чистую HTTPS ссылку из логов
          HTTPS_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' localtunnel.log | head -1 || true)
          
          if [ -z "$HTTPS_URL" ]; then
            echo "::warning::Основной сервер localtunnel перегружен, запускаем альтернативный сервер..."
            nohup lt --port 8080 --host https://localtunnel.me > localtunnel.log 2>&1 &
            sleep 5
            HTTPS_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' localtunnel.log | head -1 || true)
          fi

          if [ -z "$HTTPS_URL" ]; then
            echo "::error::Не удалось поднять безопасный HTTPS туннель."
            cat localtunnel.log
            exit 1
          fi

          echo "=========================================================="
          echo "ВХОД В ВАШ ОБЛАЧНЫЙ ВОРКСПЕЙС (Firebase Studio / IDX):"
          echo "    Защищенная ссылка (HTTPS): ${HTTPS_URL}"
          echo "    Пароль для входа: сохранен в вашем WORKSPACE_PASSWORD"
          echo "=========================================================="

          # 4. Тайм-трекер (Keep-Alive GUARD)
          START_TIME=$(date +%s)
          MAX_DURATION=19800

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ $ELAPSED -ge $MAX_DURATION ]; then
              echo "Достигнут безопасный лимит времени (5.5 часов). Сохраняем состояние..."
              break
            fi
            
            if ! pgrep -x "code-server" > /dev/null; then
              echo "Внимание: Процесс code-server упал, перезапуск..."
              code-server "$WORKSPACE_DIR" &
            fi
            
            sleep 60
          done

      # --- ФИНАЛЬНЫЙ ЭТАП: СЛУЖЕБНЫЙ СНАПШОТ ---
      - name: Archive Hard Copy (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-workspace-snapshot-${{ github.run_number }}
          path: |
            ${{ env.WORKSPACE_DIR }}/
            .pi/
